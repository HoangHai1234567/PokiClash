<title>Tiếng đánh nhau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Bố cục: một cột; thanh trên dính (số đã chọn, nút chép); mỗi nhóm đòn một thẻ, mỗi tiếng một hàng (nút nghe, tên, ô chọn) */
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --fg: #2b2118; --muted: #74655a; --line: #e2d8c8;
    --accent: #d2602a; --accent-ink: #ffffff; --chip: #efe7da; --on: #2f8fe8;
    --f-head: "Baloo 2", "Segoe UI", system-ui, sans-serif;
    --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1b1713; --panel: #241f1a; --fg: #f1e8dc; --muted: #b3a493; --line: #3a3128; --accent: #f08a4f; --accent-ink: #1b1209; --chip: #2f2821; --on: #58b4ff; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1b1713; --panel: #241f1a; --fg: #f1e8dc; --muted: #b3a493; --line: #3a3128; --accent: #f08a4f; --accent-ink: #1b1209; --chip: #2f2821; --on: #58b4ff; color-scheme: dark; }
  body { background: var(--bg); color: var(--fg); font-family: var(--f-body); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .wrap { max-width: 820px; margin: 0 auto; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  h1 { font-family: var(--f-head); font-size: 1.5rem; line-height: 1.1; margin: 0; }
  .sub { color: var(--muted); font-size: 0.88rem; margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; }
  button { font: 600 0.92rem var(--f-body); border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 10px; padding: 8px 12px; cursor: pointer; min-height: 40px; }
  button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--on); outline-offset: 2px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 64px; font: 0.85rem/1.4 ui-monospace, Consolas, monospace; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .nhom { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .nhom h2 { font-family: var(--f-head); font-size: 1.15rem; margin: 0; }
  .nhom p { margin: 2px 0 10px; color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
  .item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line); }
  .item:first-of-type { border-top: 0; }
  .play { width: 44px; height: 40px; padding: 0; font-size: 1rem; }
  .play.on { background: var(--on); color: #fff; border-color: var(--on); }
  .meta { min-width: 0; }
  .meta b { font-variant-numeric: tabular-nums; }
  .meta span { display: block; color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; }
  label.pick { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
  label.pick input { width: 22px; height: 22px; accent-color: var(--accent); }
  .item.chon { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; }
  .note { color: var(--muted); font-size: 0.82rem; margin: 0; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;600&display=swap">

<div class="wrap">
  <div class="bar">
    <h1>Tiếng đánh nhau</h1>
    <p class="sub">Ứng viên từ các gói CC0 (miễn phí, dùng thương mại, không cần ghi công). Bấm ▶ để nghe, tick tiếng ưng ý, rồi bấm "Chép danh sách" và dán lại cho Claude.</p>
    <div class="row">
      <span class="count" id="count">Đã chọn 0</span>
      <button class="main" id="copy">Chép danh sách</button>
      <button id="clear">Bỏ chọn hết</button>
    </div>
    <textarea id="out" readonly aria-label="Danh sách đã chọn" placeholder="Danh sách đã chọn hiện ở đây"></textarea>
  </div>
  <div id="list"></div>
  <p class="note">Còn thiếu và sẽ gen nếu cần: gió / lốc xoáy, sóng lớn đổ ụp, tia nước phun dài. Chưa đưa vào game.</p>
</div>

  const list = document.getElementById("list"), out = document.getElementById("out"), count = document.getElementById("count");
  let cur = null, curBtn = null;
  const picked = new Set();
  try { (JSON.parse(localStorage.getItem("tran_chon") || "[]")).forEach(x => picked.add(x)); } catch (e) {}
  function save() { try { localStorage.setItem("tran_chon", JSON.stringify([...picked])); } catch (e) {} }
  function refresh() {
    const byGroup = NHOM.map(g => {
      const ids = g.items.filter(i => picked.has(i.id)).map(i => i.id);
      return ids.length ? g.code + ": " + ids.join(" ") : null;
    }).filter(Boolean);
    out.value = byGroup.join("\n");
    count.textContent = "Đã chọn " + picked.size;
    document.querySelectorAll(".item").forEach(el => el.classList.toggle("chon", picked.has(el.dataset.id)));
  }
  function stop() {
    if (cur) { cur.pause(); cur.currentTime = 0; }
    if (curBtn) { curBtn.classList.remove("on"); curBtn.textContent = "▶"; }
    cur = curBtn = null;
  }
  NHOM.forEach(g => {
    const sec = document.createElement("section");
    sec.className = "nhom";
    sec.innerHTML = "<h2></h2><p></p>";
    sec.querySelector("h2").textContent = g.name + " (" + g.items.length + ")";
    sec.querySelector("p").textContent = g.note;
    g.items.forEach(it => {
      const row = document.createElement("div");
      row.className = "item"; row.dataset.id = it.id;
      const b = document.createElement("button");
      b.className = "play"; b.textContent = "▶"; b.setAttribute("aria-label", "Nghe " + it.id);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = "<b></b><span></span>";
      meta.querySelector("b").textContent = it.id;
      meta.querySelector("span").textContent = it.pack + " · " + it.name;
      const lab = document.createElement("label");
      lab.className = "pick";
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.id = "c_" + it.id; cb.checked = picked.has(it.id);
      lab.append(cb, document.createTextNode("Chọn"));
      cb.addEventListener("change", () => { cb.checked ? picked.add(it.id) : picked.delete(it.id); save(); refresh(); });
      b.addEventListener("click", () => {
        if (curBtn === b) { stop(); return; }
        stop();
        const a = new Audio(it.file);
        cur = a; curBtn = b; b.classList.add("on"); b.textContent = "■";
        a.addEventListener("ended", () => { if (curBtn === b) stop(); });
        a.play().catch(() => stop());
      });
      row.append(b, meta, lab);
      sec.appendChild(row);
    });
    list.appendChild(sec);
  });
  document.getElementById("copy").addEventListener("click", () => {
    if (!out.value) return;
    out.select();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out.value).catch(() => {});
  });
  document.getElementById("clear").addEventListener("click", () => {
    picked.clear(); save();
    document.querySelectorAll("label.pick input").forEach(c => c.checked = false);
    refresh();
  });
  refresh();
})();
