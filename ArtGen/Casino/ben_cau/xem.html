<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bến câu concept</title>
<style>
  :root { --bg: #f6efdf; --ink: #2b2118; --ink2: #6a5442; --card: #fffaf0; --line: #e2d3b4; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1f1a15; --ink: #f1e6d2; --ink2: #c4b096; --card: #2a231c; --line: #4a3d30; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--ink2); margin: 0 0 16px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 24px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  figure img { width: 100%; height: auto; display: block; border-radius: 6px; }
  figcaption { margin-top: 8px; font-size: 14px; }
  b { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>Bến câu: concept B0</h1>
  <p>Magnific GPT 2.6, 1k high, 95 credit / tờ. Ảnh mẫu nét: world_style.png + tờ nhân vật chính đã duyệt. Đây là ảnh ghép để chốt bố cục; bản dùng trong game sẽ gen theo lớp (nền không người, mặt nạ nước cho shader, lớp trước), nhân vật rig riêng.</p>
  <div class="row">
    <figure><img src="canh_A.png" alt="Phương án A"><figcaption><b>Cảnh A</b>: dừa, chòi lá, ô dù; hồ rộng hơn, bến gỗ ngắn; lá súng và lau sậy hai bên gần bến; rạn đá giữa bờ xa.</figcaption></figure>
    <figure><img src="canh_B.png" alt="Phương án B"><figcaption><b>Cảnh B</b>: cây tán tròn, thùng gỗ; dây cờ trên lan can bến; đá viền quanh bờ; cậu nhỏ hơn một chút, hồ trông sâu hơn.</figcaption></figure>
  </div>
  <figure><img src="dang_cau.png" alt="Tờ dáng"><figcaption><b>Tờ dáng nhân vật</b> (dùng cho rig, 8 clip): 1 đứng cầm cần · 2 kéo cần ra sau (ngắm) · 3 vung quăng · 4 đợi, tay chống hông · 5 giật · 6 ghì kéo, cần cong · 7 quay lại giơ cá · 8 hụt, xụ vai.</figcaption></figure>
</main>
</body>
</html>
