<h1>D4: lều Vòng Xoay Ngũ Hành có Lão Mực (2026-11-26)</h1>
<p>Ô ra do lõi chọn theo tỉ lệ trong cấu hình; viên bi lăn bằng mô phỏng vật lý và được chọn cú thả cho nằm đúng ô đó.</p>

<h2>Chạy trong game (lượt chụp 20 khung/giây, ba vòng)</h2>
<div class="row">
  <figure><img src="vong_xoay.webp" width="360" alt="Ba vòng quay trong game">
    <figcaption>Bản đỏ đen. Vòng 1 miễn phí trúng 3 cửa (Hỏa 3) · vòng 2 trượt hết, Lão Mực vơ chip · vòng 3 trúng Sao Vàng.</figcaption></figure>
  <figure><img src="xem_bi_lan.webp" width="656" alt="Bi lăn trên bánh xe">
    <figcaption>Một cú thả bi (mô phỏng ngoài Unity, cùng hình bánh xe của game): chạy quanh vách, rơi xuống, va mấu chắn, nảy qua vách ngăn, nằm vào ô.</figcaption></figure>
</div>

<h2>Năm clip mới của Lão Mực (nền, bàn, bánh xe trong ảnh chỉ vẽ tạm)</h2>

  <figure><img src="rl_invite.gif" alt="rl_invite"><figcaption>rl_invite: mời đặt cửa</figcaption></figure>
