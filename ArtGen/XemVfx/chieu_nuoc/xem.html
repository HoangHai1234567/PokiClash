<div class="wrap"><h1>Chiêu nước mới — 8 tướng Thủy</h1>
<p>Dựng theo bộ nước gói mẫu (shader UIWaterFx, flipbook SrRubfish + NamuFX), mỗi chiêu bám động tác clip có sẵn của tướng. Chụp tour Unity, ~0,1 s một khung.
Sò Ngoạm, Bát Trảo giữ chiêu riêng. Mã: Assets/01 Script/Game/Battle/HatNuocChieu.cs.</p>
<div class="grid"><figure><img src="gif/ti_tach_2_mana.gif" loading="lazy" alt=""><figcaption>Tí Tách · Chiêu mana <b>Liên châu thủy đạn</b><span>há miệng bắn 5 viên đạn nước liên tiếp, viên cuối to toé lớn · 23 khung</span></figcaption></figure><figure><img src="gif/thach_giai_2_mana.gif" loading="lazy" alt=""><figcaption>Thạch Giải · Chiêu mana <b>Bong bóng nảy</b><span>thổi 3 bong bóng bay vồng, nảy một lần trên đất rồi vỡ ở thân đối thủ · 23 khung</span></figcaption></figure><figure><img src="gif/thach_giai_2_ult.gif" loading="lazy" alt=""><figcaption>Thạch Giải · Chiêu cuối <b>Cầu nhốt</b><span>ợ cầu nước bọc lấy đối thủ thành bong bóng trong suốt, rung hai nhịp rồi vỡ · 33 khung</span></figcaption></figure><figure><img src="gif/ca_den_2_mana.gif" loading="lazy" alt=""><figcaption>Hải Đăng · Chiêu mana <b>Bom nước</b><span>phụt cầu nặng bay vồng, vòng gợn báo chỗ rơi, nổ toé đất + cột nước · 23 khung</span></figcaption></figure><figure><img src="gif/giong_bao_2_mana.gif" loading="lazy" alt=""><figcaption>Giông Bão · Chiêu mana <b>Cầu xoáy</b><span>cầu tụ theo đầu trượng, ba cầu nhỏ quay quanh, trúng: chớp, gai sắc, toé sao · 23 khung</span></figcaption></figure><figure><img src="gif/giong_bao_2_ult.gif" loading="lazy" alt=""><figcaption>Giông Bão · Chiêu cuối <b>Mưa giông</b><span>mây giông tụ, mưa xiên, ba cột thác dội (cột giữa sau lưng đối thủ), sét · 33 khung</span></figcaption></figure><figure><img src="gif/lien_kinh_2_ult.gif" loading="lazy" alt=""><figcaption>Thôn Kình · Chiêu cuối <b>Cầu ma thủy</b><span>triệu hồi cầu ma thủy xanh biển sẫm (prefab gốc của gói, tô dải + vân chì) ngay ở thân đối thủ: cuộn tụ, lõi sáng, dải nước bay vòng, nén rồi nổ · 35 khung</span></figcaption></figure><figure><img src="gif/uyen_xa_2_mana.gif" loading="lazy" alt=""><figcaption>Uyên Xà · Chiêu mana <b>Thủy xà</b><span>rắn nước trườn uốn lượn từ hai sừng tới, hai hàm lưỡi liềm ngoạm · 24 khung</span></figcaption></figure><figure><img src="gif/uyen_xa_2_ult.gif" loading="lazy" alt=""><figcaption>Uyên Xà · Chiêu cuối <b>Chém nước</b><span>đuôi sừng quất: ba lưỡi chém nước cung lưỡi liềm + vệt sáng · 34 khung</span></figcaption></figure><figure><img src="gif/han_ngac_2_ult.gif" loading="lazy" alt=""><figcaption>Hàn Ngạc · Chiêu cuối <b>Siêu bão xoáy</b><span>phễu nước + vòng xoáy rộng ba tầng, mắt bão trên đỉnh, mảnh băng bạc bay vòng, gió mưa quất · 36 khung</span></figcaption></figure><figure><img src="gif/han_ngac_1_ult.gif" loading="lazy" alt=""><figcaption>Hàn Ngạc (Ngạc Nhi) · Chiêu cuối <b>Bão xoáy (nhẹ)</b><span>bản dạng 1: ít tầng, ít mảnh băng · 35 khung</span></figcaption></figure><figure><img src="gif/hai_long_3_mana.gif" loading="lazy" alt=""><figcaption>Hải Long (Ngũ Đầu) · Chiêu mana <b>Loạt thủy cầu</b><span>mỗi đầu nhả một cầu nước đúng lúc vươn ra (5 đầu) · 24 khung</span></figcaption></figure></div></div>
