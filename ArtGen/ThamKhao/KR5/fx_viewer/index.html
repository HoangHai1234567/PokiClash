<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KR5 hiệu ứng</title>
<style>
:root{--bg:#16181b;--panel:#1f2226;--panel2:#262a2f;--line:#33383e;--fg:#e6e2d8;--dim:#9a968c;--acc:#ffb347;--acc2:#6cc3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:600}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:1px solid transparent;color:var(--dim);padding:5px 12px;border-radius:6px;cursor:pointer;font:inherit}
.tabs button.on{color:var(--fg);border-color:var(--line);background:var(--panel2)}
#app{display:grid;grid-template-columns:240px 1fr;height:calc(100% - 45px)}
aside{border-right:1px solid var(--line);overflow:auto;padding:10px;background:var(--panel)}
aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:14px 0 6px}
aside input[type=search],aside select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:6px 8px;border-radius:6px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;cursor:pointer;color:var(--dim);user-select:none;font-size:12px}
.chip.on{color:#1b1b1b;background:var(--acc);border-color:var(--acc)}
.chip small{opacity:.7;margin-left:3px}
label.ck{display:flex;align-items:center;gap:6px;margin:4px 0;color:var(--dim);cursor:pointer}
main{overflow:auto;position:relative}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card canvas{display:block;width:100%;aspect-ratio:1;background:#202328}
.card .nm{padding:4px 6px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tg{padding:0 6px 5px;font-size:10px;color:var(--acc2)}
#more{margin:6px 10px 20px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:8px 14px;border-radius:6px;cursor:pointer}
#count{padding:8px 12px 0;color:var(--dim)}
#detail{position:fixed;inset:45px 0 0 240px;background:var(--bg);display:none;grid-template-columns:1fr 380px;z-index:5}
#detail.open{display:grid}
#stageWrap{position:relative;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
#stage{flex:1;width:100%;min-height:0;display:block;cursor:grab}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);background:var(--panel)}
.bar button,.bar select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font:inherit;cursor:pointer}
.bar button.on{border-color:var(--acc);color:var(--acc)}
.bar .t{color:var(--dim);font-variant-numeric:tabular-nums;min-width:120px}
#timeline{height:34px;position:relative;background:#111316;border-top:1px solid var(--line);cursor:pointer}
#timeline .ev{position:absolute;top:3px;font-size:10px;color:#111;background:var(--acc2);border-radius:3px;padding:0 4px;white-space:nowrap;transform:translateX(-1px)}
#timeline .ev.hit{background:var(--acc)}
#timeline .head{position:absolute;top:0;bottom:0;width:2px;background:#fff}
#info{overflow:auto;padding:12px 14px}
#info h2{font-size:14px;margin:0 0 4px;word-break:break-all}
#info .sub{color:var(--dim);margin-bottom:10px}
#info table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0 12px}
#info td{border-bottom:1px solid var(--line);padding:3px 4px;vertical-align:top}
#info td:first-child{color:var(--dim);white-space:nowrap;width:42%}
#info h4{margin:14px 0 4px;font-size:12px;color:var(--acc)}
#info pre{background:#111316;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11px;overflow:auto;max-height:260px;white-space:pre-wrap;word-break:break-all}
#info a{color:var(--acc2);cursor:pointer;text-decoration:none}
#strip{overflow:auto;background:#111316;border:1px solid var(--line);border-radius:6px;max-height:340px;position:relative}
#strip img{display:block;image-rendering:auto}
.pal{display:flex;height:22px;border-radius:4px;overflow:hidden;margin:4px 0}
.pal div{flex:1}
.close{position:absolute;top:8px;right:10px;z-index:3;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.note{color:var(--dim);font-size:12px}
.atk{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 8px;margin:4px 0;cursor:pointer;font:inherit}
.atk.on{border-color:var(--acc)}
.atk small{color:var(--dim)}
.k{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>Kingdom Rush 5 · hiệu ứng</h1>
  <div class="tabs">
    <button data-tab="learn" class="on">Đáng học</button>
    <button data-tab="lib">Thư viện hình</button>
    <button data-tab="tpl">Hệ hạt và tổ hợp</button>
    <button data-tab="unit">Chiêu của đơn vị</button>
  </div>
  <span class="note" id="status">đang nạp dữ liệu…</span>
</header>
<div id="app">
  <aside>
    <input type="search" id="q" placeholder="Tìm theo tên (vd. explosion, fire)">
    <h3>Hệ</h3><div class="chips" id="tagChips"></div>
    <h3 id="kindH">Loại</h3><div class="chips" id="kindChips"></div>
    <h3>Nguồn</h3><select id="src"></select>
    <h3>Tuỳ chọn</h3>
    <label class="ck" id="bodyCk"><input type="checkbox" id="showBody"> hiện cả thân nhân vật</label>
    <label class="ck"><input type="checkbox" id="animThumb" checked> chạy hoạt ảnh trong lưới</label>
    <p class="note" style="margin-top:14px">Toàn bộ hiệu ứng trong trận vẽ bằng blend alpha thường (không cộng sáng). Ánh sáng, quầng, lửa sáng đều là màu vẽ sẵn trong khung.</p>
  </aside>
  <main id="main">
    <div id="count"></div>
    <div id="grid"></div>
    <button id="more">Xem thêm</button>
  </main>
</div>
<div id="detail">
  <div id="stageWrap">
    <button class="close" id="closeBtn">Đóng ✕</button>
    <canvas id="stage"></canvas>
    <div id="timeline"></div>
    <div class="bar">
      <button id="playBtn">⏸</button>
      <button id="stepB">◀ khung</button><button id="stepF">khung ▶</button>
      <button id="replay">↺ phát lại</button>
      <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option><option value="0.1">0.1×</option><option value="2">2×</option></select>
      <select id="bg"><option value="dark">nền tối</option><option value="grass">nền đất cỏ</option><option value="light">nền sáng</option><option value="check">ô caro</option></select>
      <button id="onion">bóng khung kề</button>
      <button id="boxes">khung + gốc</button>
      <span class="t" id="tlabel"></span>
    </div>
  </div>
  <div id="info"></div>
</div>
<script>
'use strict';
// ------------------------------------------------------------ dữ liệu
let D = null; const RS = 0.5, FPS = 30, EPS = 1e-9;
const IMG = {}, EXO = {}, EXO_LOADING = {};
function img(src){ let im = IMG[src]; if (!im){ im = new Image(); im.src = 'sheets/' + src; IMG[src] = im; } return im; }
function ready(im){ return im && im.complete && im.naturalWidth > 0; }
function loadExo(en){
  if (EXO[en] || EXO_LOADING[en]) return; const m = D.exos[en]; if (!m) return;
  EXO_LOADING[en] = fetch(m.f).then(r => r.json()).then(j => { EXO[en] = j; img(j.img); });
}
// ------------------------------------------------------------ ma trận [a b c d e f]
function mul(m, n){ const [a,b,c,d,e,f] = m, [A,B,C,DD,E,F] = n; return [a*A+c*B, b*A+d*B, a*C+c*DD, b*C+d*DD, a*E+c*F+e, b*E+d*F+f]; }
const T = (x,y) => [1,0,0,1,x,y], S = (x,y) => [x,0,0,y,0,0];
const R = t => { const c = Math.cos(t), s = Math.sin(t); return [c,s,-s,c,0,0]; };
function loveM(x, y, r, sx, sy, ox, oy, kx, ky){
  const c = Math.cos(r), s = Math.sin(r);
  const a = c*sx - ky*s*sy, b = s*sx + ky*c*sy, cc = kx*c*sx - s*sy, d = kx*s*sx + c*sy;
  return [a, b, cc, d, x - ox*a - oy*cc, y - ox*b - oy*d];
}
function setT(ctx, m){ ctx.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]); }
// ------------------------------------------------------------ khung hoạt ảnh (đúng animation_db:fni)
function animIdx(n, t, loop, fps){
  if (n <= 1) return 0;
  if (loop) return ((Math.floor(t*fps + EPS) % n) + n) % n;
  return Math.min(n, Math.max(1, Math.ceil(t*fps + EPS))) - 1;
}
function assetLen(key){ const a = D.assets[key]; if (!a) return 0; return a.t === 'x' ? a.n : a.seq.length; }
function assetFps(key){ const a = D.assets[key]; if (a && a.t === 'x'){ const m = D.exos[a.exo]; return m ? m.fps : 30; } return 30; }
// vẽ một tài sản tại ma trận gốc M (toạ độ màn hình y xuống, gốc = vị trí thực thể)
function drawAsset(ctx, M, key, t, o, boxes){
  const a = D.assets[key]; if (!a) return;
  const loop = o.loop !== false, fps = o.fps || assetFps(key);
  const sc = o.sc || [1,1], an = o.an || [0.5,0.5], al = (o.al == null ? 255 : o.al) / 255, flip = o.fx ? -1 : 1;
  if (al <= 0) return;
  if (a.t !== 'x'){
    const im = img(a.img); if (!ready(im)) return;
    const c = a.cells[a.seq[animIdx(a.seq.length, t, loop, fps)]]; if (!c || !c[2]) return;
    const [x,y,w,h,dx,dy,W,H] = c;
    let m = mul(M, T(o.of ? o.of[0] : 0, o.of ? -o.of[1] : 0));
    if (o.r) m = mul(m, R(-o.r));
    m = mul(m, S(sc[0]*RS*flip, sc[1]*RS));
    setT(ctx, m); ctx.globalAlpha = Math.min(1, al);
    ctx.drawImage(im, x, y, w, h, dx - an[0]*W, dy - (1-an[1])*H, w, h);
    if (boxes){ ctx.globalAlpha = 1; ctx.lineWidth = 1/Math.hypot(m[0], m[1]); ctx.strokeStyle = 'rgba(108,195,255,.8)'; ctx.strokeRect(dx - an[0]*W, dy - (1-an[1])*H, w, h); }
    return;
  }
  const ex = EXO[a.exo]; if (!ex){ loadExo(a.exo); return; }
  const im = img(ex.img); if (!ready(im)) return;
  const frames = ex.anims[a.anim]; if (!frames || !frames.length) return;
  const fr = frames[animIdx(frames.length, t, loop, ex.fps)];
  const fsx = flip*sc[0], fsy = sc[1], rr = o.r || 0;
  const offx = o.of ? o.of[0] : 0, offy = o.of ? o.of[1] : 0;
  for (const p of fr){
    const pm = ex.parts[p[0]]; if (!pm || !pm[2]) continue;
    const po = ex.po[p[0]] || [0,0];
    const [x,y,w,h,dx,dy,W,H] = pm;
    const ox = 0.5*W - po[0]/RS, oy = 0.5*H - po[1]/RS;
    const m = mul(M, loveM(p[1]*fsx + offx, p[2]*fsy + offy, (p[3] - rr)*Math.sign(fsx), p[4]*flip*RS*sc[0], p[5]*RS*sc[1], ox, oy, p[6], p[7]));
    const pa = Math.max(0, Math.min(1, p[8])) * al; if (pa <= 0) continue;
    setT(ctx, m); ctx.globalAlpha = pa;
    ctx.drawImage(im, x, y, w, h, dx, dy, w, h);
    if (boxes){ ctx.globalAlpha = 1; ctx.lineWidth = 1/Math.hypot(m[0], m[1]); ctx.strokeStyle = 'rgba(108,195,255,.6)'; ctx.strokeRect(dx, dy, w, h); }
  }
}
// hộp bao (toạ độ thực thể, y xuống) để căn khung nhìn
function assetBounds(key, o){
  const a = D.assets[key]; if (!a) return null; o = o || {};
  const sc = o.sc || [1,1], an = o.an || [0.5,0.5];
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  if (a.t !== 'x'){
    for (const c of a.cells){ if (!c || !c[2]) continue; const [x,y,w,h,dx,dy,W,H] = c;
      add((dx - an[0]*W)*RS*sc[0], (dy - (1-an[1])*H)*RS*sc[1]); add((dx + w - an[0]*W)*RS*sc[0], (dy + h - (1-an[1])*H)*RS*sc[1]); }
  } else {
    const ex = EXO[a.exo]; if (!ex) return null;
    for (const fr of ex.anims[a.anim] || []) for (const p of fr){
      const pm = ex.parts[p[0]]; if (!pm || !pm[2] || p[8] <= 0) continue; const po = ex.po[p[0]] || [0,0];
      const [x,y,w,h,dx,dy,W,H] = pm; const ox = 0.5*W - po[0]/RS, oy = 0.5*H - po[1]/RS;
      const m = loveM(p[1]*sc[0], p[2]*sc[1], p[3], p[4]*RS*sc[0], p[5]*RS*sc[1], ox, oy, p[6], p[7]);
      for (const [u, v] of [[dx,dy],[dx+w,dy],[dx,dy+h],[dx+w,dy+h]]) add(m[0]*u + m[2]*v + m[4], m[1]*u + m[3]*v + m[5]);
    }
  }
  if (x1 < x0) return null;
  const of = o.of || [0,0];
  return [x0 + of[0], y0 - of[1], x1 + of[0], y1 - of[1]];
}
// ------------------------------------------------------------ thực thể mô phỏng (render + tween + hạt + đạn), theo systems.lua
const TICK = 1/60;
function lerpV(a, b, t, fn){
  const f = fn === 'quad' ? t*t : fn === 'sine' ? 0.5*(1 - Math.cos(t*Math.PI)) : fn === 'step' ? 0 : t;
  if (Array.isArray(a)) return [a[0] + (b[0]-a[0])*f, a[1] + (b[1]-a[1])*f];
  if (typeof a === 'boolean') return a;
  return a + (b - a)*f;
}
function phaseInterp(vals, ph, def){
  if (!vals || !vals.length) return def;
  if (vals.length === 1) return vals[0];
  const n = vals.length - 1, i = Math.min(n - 1, Math.floor(ph*n)), f = ph*n - i;
  const a = vals[i], b = vals[i+1];
  if (Array.isArray(a)) return a.map((x, k) => x + (b[k] - x)*f);
  if (typeof a === 'boolean') return a;
  return a + (b - a)*f;
}
function rand(a, b){ return a + Math.random()*(b - a); }
class Ent {
  constructor(scene, name, pos, t0, opt){
    this.sc = scene; this.name = name; this.d = D.tpl[name] || {}; this.pos = [pos[0], pos[1]]; this.t0 = t0; this.dead = false;
    this.opt = opt || {}; this.flip = !!this.opt.flip;
    this.sp = (this.d.sp || []).map(s => ({...s, st: t0 + (s.rts ? -Math.random()*s.rts : 0)}));
    this.ps = this.d.ps ? new PSys(this, this.d.ps, t0) : null;
    if (this.d.tw && this.d.tw.dis && !this.opt.forceTween) this.tw = null; else this.tw = this.d.tw || null;
    this.twT0 = t0 + (this.tw && this.tw.rts ? -Math.random()*this.tw.rts : 0);
    this.life = null;
    if (this.d.aur && this.d.aur.duration) this.life = this.d.aur.duration;
    if (this.d.mod && this.d.mod.duration) this.life = Math.min(this.d.mod.duration, 4);
    if (this.d.tim && this.d.tim.duration) this.life = this.d.tim.duration;
    if (this.opt.life) this.life = this.opt.life;
    this.r = 0;
  }
  update(t){
    if (this.dead) return;
    const lt = t - this.t0;
    // tween
    let finished = true;
    if (this.tw){
      for (const p of this.tw.p){
        const keys = p.k; const s = this.sp[(p.s || 1) - 1]; if (!s || !keys.length) continue;
        const st = keys[0][0], et = keys[keys.length-1][0], dur = et - st;
        let time = t - this.twT0 + (p.to || 0);
        if (p.l && dur > 0) time = time % dur;
        if (this.tw.rev) time = dur - time;
        time = Math.max(st, Math.min(et, time));
        let ka = keys[0], kb = keys[keys.length-1];
        for (const k of keys){ if (k[0] <= time) ka = k; if (time <= k[0]){ kb = k; break; } }
        let v = ka === kb ? ka[1] : lerpV(ka[1], kb[1], (time - ka[0])/(kb[0] - ka[0]), ka[2] || p.i);
        const nm = p.n === 'alpha' ? 'al' : p.n === 'scale' ? 'sc' : p.n === 'offset' ? 'of' : p.n === 'r' ? 'r' : p.n === 'hidden' ? 'hid' : null;
        if (!nm) continue;
        if (p.m){ const base = s['_b_' + nm] ?? (s['_b_' + nm] = s[nm] ?? (nm === 'sc' ? [1,1] : nm === 'al' ? 255 : 0));
          v = Array.isArray(v) ? [v[0]*base[0], v[1]*base[1]] : (typeof v === 'boolean' ? v && base : v*base); }
        s[nm] = v;
        if (!p.l && ka !== keys[keys.length-1]) finished = false;
      }
      if (finished && this.tw.rm !== false && !this.d.ps) this.dead = true;
    }
    // timed (fx): xoá khi sprite chạy xong 1 lượt
    if (this.d.tim && !this.life){
      const s = this.sp[(this.d.tim.sprite_id || 1) - 1];
      if (s && s.a){ const n = assetLen(s.a), fps = s.fps || assetFps(s.a); if (n && (t - s.st) >= n/fps * (this.d.tim.runs || 1)) this.dead = true; }
      else if (!this.d.ps) this.dead = lt > 1.5;
    }
    if (this.life != null && lt >= this.life){ if (this.ps){ this.ps.emit = false; } else this.dead = true; }
    if (this.bul) this.bul.update(t);
    if (this.ps){ this.ps.update(t); if (this.ps.done) this.dead = true; }
    if (this.follow && !this.follow.dead){ this.pos = [this.follow.pos[0], this.follow.pos[1]]; }
    else if (this.follow && this.follow.dead && this.ps){ this.ps.emit = false; this.ps.srcDead = true; }
  }
  draws(out, t){
    if (this.dead) return;
    const sc = this.sc;
    this.sp.forEach((s, i) => {
      if (!s.a || s.hid) return;
      if (s.ign && t < s.st) return;
      const z = s.z ?? D.z.Z_OBJECTS ?? 3000;
      out.push({z, y: this.pos[1] + (s.sy || 0), o: (s.do || i + 1), fn: (ctx, V, boxes) => {
        const M = mul(V, T(this.pos[0], -this.pos[1]));
        drawAsset(ctx, M, s.a, t - s.st + (s.to || 0), {loop: s.loop, fps: s.fps, sc: s.sc, an: s.an, al: s.al, of: s.of, r: (s.r || 0) + this.r, fx: (s.fx ? !this.flip : this.flip)}, boxes);
      }});
    });
    if (this.ps) this.ps.draws(out, t);
  }
}
class PSys {
  constructor(ent, d, t0){
    this.e = ent; this.d = d; this.emit = true; this.parts = [];
    const rate = d.emission_rate || 1; this.emit_ts = t0 - 1/rate + (d.ts_offset || 0); this.ts = t0; this.last = null; this.done = false; this.lastT = t0;
    this.emitStart = t0;
  }
  update(t){
    const d = this.d, e = this.e, rate = d.emission_rate || 1;
    if (!this.last) this.last = [e.pos[0], e.pos[1]];
    if (d.emit_duration != null && this.emit && t - this.emitStart > d.emit_duration) this.emit = false;
    if (!this.emit){ this.emit_ts = t + (d.ts_offset || 0); this.last = [e.pos[0], e.pos[1]]; }
    if (this.emit && 1/rate < t - this.emit_ts){
      const cf = (t - this.emit_ts)*rate, stx = (e.pos[0] - this.last[0])/cf, sty = (e.pos[1] - this.last[1])/cf, cnt = Math.floor(cf);
      for (let i = 1; i <= cnt; i++){
        const pts = this.emit_ts + i/rate;
        const p = {ts: pts, last: pts, r: 0, spin: 0, sf: [1,1], vx: 0, vy: 0};
        const lt = d.particle_lifetime || [0.9, 1]; p.life = rand(lt[0], lt[1]);
        p.x = this.last[0] + stx*i; p.y = this.last[1] + sty*i;
        if (d.emit_area_spread){ p.x += rand(-d.emit_area_spread.x/2, d.emit_area_spread.x/2); p.y += rand(-d.emit_area_spread.y/2, d.emit_area_spread.y/2); }
        if (d.emit_offset){ p.x += (e.flip ? -1 : 1)*d.emit_offset.x; p.y += d.emit_offset.y; }
        const dir = (d.emit_direction || 0) + (e.dirOverride || 0);

// đạn: bay từ A tới B. bomb/arrow có flight_time: parabol theo g; bolt: đường thẳng; khi tới nơi gọi hit
class Bul {
  constructor(ent, from, to, t0, onHit){
    this.e = ent; const b = ent.d.bl || {}; this.from = from; this.to = to; this.t0 = t0; this.onHit = onHit;
    const dx = to[0] - from[0], dy = to[1] - from[1], dist = Math.hypot(dx, dy);
    const ray = ent.d.ray;
    if (ray && ray.image_width){   // tia: một hình kéo dãn từ nguồn tới đích (scripts.ray*_simple)
      this.isRay = true; const s0 = ent.sp[0];
      const k = dist/ray.image_width; ent.r = Math.atan2(dy, dx);
      if (s0){ s0.sc = [k*((s0.sc && s0.sc[0]) || 1), (s0.sc && s0.sc[1]) || 1]; }
      const mid = s0 && s0.an && Math.abs(s0.an[0] - 0.5) < 0.01;
      ent.pos = mid ? [from[0] + dx/2, from[1] + dy/2] : [from[0], from[1]];
      const n = s0 && s0.a ? assetLen(s0.a)/assetFps(s0.a) : 0.6;
      this.T = b.hit_time || 0; this.life = ray.ray_duration || n; return;
    }
    const chain0 = [ent.name].concat(ent.d.b || []).join(' ');
    if (b.hit_time != null && !b.flight_time && !/bolt|arrow|bomb/.test(chain0)){   // đạn đứng yên (luồng thở, cột): diễn tại nguồn, quay về đích
      this.isRay = true; ent.r = Math.atan2(dy, dx); ent.pos = [from[0], from[1]];
      const s0 = ent.sp[0]; this.T = b.hit_time; this.life = s0 && s0.a ? assetLen(s0.a)/assetFps(s0.a) : 0.8; return;
    }
    const chain = [ent.name].concat(ent.d.b || []).join(' ');
    this.straight = /bolt|ray|lance|beam|missile|rocket/.test(chain) && !b.flight_time;
    this.T = b.flight_time || (this.straight ? dist/Math.max(150, b.max_speed || 450) : 0.6);
    this.g = (b.g != null && !this.straight) ? b.g : 0;
    this.vx = dx/this.T; this.vy = (dy - 0.5*this.g*this.T*this.T)/this.T;
    this.align = !!b.align_with_trajectory || this.straight; this.rs = b.rotation_speed || 0;
    ent.pos = [from[0], from[1]];
  }
  update(t){
    const lt = Math.max(0, t - this.t0), e = this.e;
    if (this.isRay){
      if (!this.hit && lt >= this.T){ this.hit = true; this.onHit && this.onHit(t); }
      if (lt >= this.life) e.dead = true;
      return;
    }
    if (lt >= this.T){ e.pos = [this.to[0], this.to[1]]; if (!e.dead){ e.dead = true; this.onHit && this.onHit(t); } return; }
    e.pos = [this.from[0] + this.vx*lt, this.from[1] + this.vy*lt + 0.5*this.g*lt*lt];
    if (this.align) e.r = Math.atan2(this.vy + this.g*lt, this.vx);
    else if (this.rs) e.r = this.rs*lt;
  }
}

class Scene {
  constructor(){ this.ents = []; this.events = []; this.marks = []; this.dur = 3; this.static = []; this.target = null; }
  at(time, label, fn, hit){ this.events.push({time, fn, done: false}); if (label) this.marks.push({time, label, hit}); }
  spawn(name, pos, t, opt){
    if (!D.tpl[name]) return null;
    const e = new Ent(this, name, pos, t, opt); this.ents.push(e);
    const d = e.d;
    if (d.bl && opt && opt.to){
      e.bul = new Bul(e, pos, opt.to, t, (th) => {
        if (d.bl.hit_fx) this.spawn(d.bl.hit_fx, opt.to, th);
        if (d.bl.hit_decal) this.spawn(d.bl.hit_decal, opt.to, th, {life: 2.5});
        if (d.bl.hit_payload) this.spawn(d.bl.hit_payload, opt.to, th, {life: 3});
        if (d.bl.mod) this.spawn(d.bl.mod, opt.to, th, {life: 2.5});
        if (Array.isArray(d.bl.mods)) d.bl.mods.forEach(m => this.spawn(m, opt.to, th, {life: 2.5}));
        this.marks.push({time: th, label: 'trúng', hit: true});
      });
      if (d.bl.particles_name){ const pe = this.spawn(d.bl.particles_name, pos, t); if (pe){ pe.follow = e; pe.life = null; } }
      if (d.bl.start_fx) this.spawn(d.bl.start_fx, pos, t);
    }
    return e;
  }
  reset(){ this.ents = []; for (const ev of this.events) ev.done = false; this.marks = this.marks.filter(m => !m.dyn); this.marks = this.marks.filter(m => m.label !== 'trúng'); }
  step(t){
    for (const ev of this.events) if (!ev.done && ev.time <= t){ ev.done = true; ev.fn(ev.time); }
    for (const e of this.ents) e.update(t);
    this.ents = this.ents.filter(e => !e.dead);
  }
  draw(ctx, V, t, boxes){
    const out = [];
    for (const s of this.static) s(out, t);
    for (const e of this.ents) e.draws(out, t);
    out.sort((a, b) => a.z - b.z || b.y - a.y || a.o - b.o);
    for (const it of out) it.fn(ctx, V, boxes);
  }
}

      row('vùng phát', p.emit_area_spread ? fmt(p.emit_area_spread) : '') + row('lệch điểm phát', p.emit_offset ? fmt(p.emit_offset) : '') + row('thời gian phát', p.emit_duration != null ? p.emit_duration + ' s' : '') +
      row('đời nguồn', p.source_lifetime != null ? p.source_lifetime + ' s' : '') + row('hạt có hoạt ảnh', p.animated ? 'có' + (p.animation_fps ? ' (' + p.animation_fps + ' khung/giây)' : '') + (p.loop ? ', lặp' : ', chạy 1 lần') : 'không') + row('z', p.z) + '</table>'; }
  if (o.bl){ h += `<h4>Đạn</h4><table>`; for (const [k, v] of Object.entries(o.bl)) h += row(k, typeof v === 'string' ? tplLink(v) : fmt(v)); h += '</table><p class="note">Đường bay mô phỏng: có flight_time thì bay parabol theo g; bolt/tia bay thẳng. Đích ở bên phải.</p>'; }
  for (const [k, lab] of [['aur', 'Aura'], ['mod', 'Modifier'], ['tim', 'Timed']]) if (o[k]){ h += `<h4>${lab}</h4><table>`; for (const [kk, v] of Object.entries(o[k])) h += row(kk, fmt(v)); h += '</table>'; }
  if (o.ref && o.ref.length) h += `<h4>Template liên quan</h4><div>${o.ref.map(tplLink).join(', ')}</div>`;
  const users = Object.entries(D.tpl).filter(([k, x]) => (x.ref || []).includes(name)).map(([k]) => k);
  const uusers = Object.entries(D.units).filter(([k, u]) => JSON.stringify(u.atk).includes('"' + name + '"')).map(([k]) => k);
  if (users.length || uusers.length) h += `<h4>Được dùng bởi</h4><div>${uusers.map(tplLink).concat(users.map(tplLink)).join(', ')}</div>`;
  $('info').innerHTML = h; bindLinks();
}
function targetMark(B){
  return (out, t) => out.push({z: 1000, y: 9999, o: 0, fn: (ctx, V) => { setT(ctx, mul(V, T(B[0], -B[1]))); ctx.globalAlpha = 0.5; ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 1.5/view.z;
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 9, 0, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1; }});
}
// --- 3. đơn vị và chiêu
function openUnit(name, ai){
  const u = D.units[name]; const atk = u.atk[ai] || u.atk[0]; scene = new Scene();
  const flipT = false, P = [0, 0];
  const B = u.k === 'tower' ? [210, -90] : (atk.g === 'melee' ? [55, 0] : [240, 0]);
  const bodyKeys = (atk.body && atk.body[0]) || [];
  let bodyDur = 0.6;
  bodyKeys.forEach(k => { if (k && D.assets[k]) bodyDur = Math.max(bodyDur, assetLen(k)/assetFps(k)); });
  scene.static.push((out, t) => {
    u.body.forEach((b, j) => {
      const ka = bodyKeys[j], ki = u.idle[j];
      let key = ka && D.assets[ka] && t < bodyDur ? ka : ki, tt = key === ka ? t : t - bodyDur;
      if (!key || !D.assets[key]) return;
      out.push({z: b.z ?? 3000, y: 0, o: b.do || j + 1, fn: (ctx, V, bx) => drawAsset(ctx, V, key, Math.max(0, tt), {loop: key !== ka, an: b.an, of: b.of, sc: b.sc}, bx)});
    });
  });
  scene.static.push(targetMark(B));
  const ev = [];
  const tShoot = atk.shoot_time ?? (Array.isArray(atk.shoot_times) ? atk.shoot_times[0] : null) ?? atk.spawn_time ?? atk.hit_time ?? atk.cast_time ?? 0.3;
  const pt = v => Array.isArray(v) ? (Array.isArray(v[0]) ? v[0] : (typeof v[0] === 'number' ? v : null)) : null;
  const off = pt(atk.bullet_start_offset) || pt(atk.spawn_offset) || pt(atk.spawn_pos_offset) || [0, 40];
  const src = [P[0] + (off ? off[0] : 0), P[1] + (off ? off[1] : 40)];
  if (atk.start_fx) scene.at(0, 'start_fx', t => scene.spawn(atk.start_fx, P, t));
  const bl = atk.bullet || (Array.isArray(atk.bullets) ? atk.bullets[0] : null);
  let endT = bodyDur;
  if (typeof bl === 'string'){
    const n = Math.min(atk.bullet_count || 1, 5);
    for (let i = 0; i < n; i++) scene.at(tShoot + i*0.12, i ? null : 'bắn ' + bl, t => scene.spawn(bl, src, t, {to: [B[0] + (i - (n-1)/2)*14, B[1] + (i % 2)*8]}));
    endT = Math.max(endT, tShoot + ((D.tpl[bl] && D.tpl[bl].bl && D.tpl[bl].bl.flight_time) || 0.8) + 1.6);
  }
  for (const k of ['entity', 'aura']){ const n = atk[k]; if (typeof n !== 'string') continue;
    const o = D.tpl[n]; const at = o && (o.k === 'aura' || o.k === 'decal' || o.k === 'fx') ? B : src;
    scene.at(tShoot, (o ? 'sinh ' : 'gọi (không có hình) ') + n, t => scene.spawn(n, at, t, {life: Math.min((o && o.aur && o.aur.duration) || 3, 4), forceTween: true}));
    endT = Math.max(endT, tShoot + 3.2); }
  const mods = [].concat(atk.mod || [], Array.isArray(atk.mods) ? atk.mods : []);
  for (const m of mods) if (typeof m === 'string'){ scene.at(tShoot + (bl ? 0.5 : 0), 'mod ' + m, t => scene.spawn(m, B, t, {life: 2.5}), true); endT = Math.max(endT, tShoot + 3); }
  if (atk.hit_fx && !bl) { const ht = atk.hit_time ?? tShoot; scene.at(ht, 'hit_fx', t => scene.spawn(atk.hit_fx, B, t), true); endT = Math.max(endT, ht + 1.2); }
  if (atk.hit_decal && !bl) { const ht = atk.hit_time ?? tShoot; scene.at(ht, 'decal', t => scene.spawn(atk.hit_decal, B, t, {life: 2})); }
  scene.dur = Math.min(Math.max(endT, bodyDur) + 0.6, 9);
  let fb = null; for (let j = 0; j < u.body.length; j++){ const k = bodyKeys[j] || u.idle[j]; const bb = k && assetBounds(k, u.body[j]); if (bb) fb = fb ? [Math.min(fb[0], bb[0]), Math.min(fb[1], bb[1]), Math.max(fb[2], bb[2]), Math.max(fb[3], bb[3])] : bb; }
  fb = fb || [-60, -120, 60, 10];
  fitTo([Math.min(fb[0], -40), Math.min(fb[1], -B[1] - 90), Math.max(fb[2], B[0] + 80), Math.max(fb[3], -B[1] + 50)], 80);
  let h = `<h2>${name}</h2><div class="sub">${UKIND_VI[u.k]} · ${u.atk.length} đòn · ${unitTags(u).map(t => TAGVI[t]).join(', ')}</div>`;
  h += `<div>${u.atk.map((a, i) => `<button class="atk ${a === atk ? 'on' : ''}" data-i="${i}">${a.g}[${a.i}] ${a.animation || '(không anim)'} <small>${[a.bullet, a.entity, a.aura, a.mod, a.hit_fx].filter(x => typeof x === 'string').join(' · ')}</small></button>`).join('')}</div>`;
  h += `<h4>Đòn đang xem</h4><table>`;
  for (const [k, v] of Object.entries(atk)) if (!['body','g','i'].includes(k)) h += row(k, typeof v === 'string' ? tplLink(v) : fmt(v));
  h += row('thân (khung)', bodyKeys.filter(Boolean).map(k => `<a data-asset="${k}">${k.slice(2)}</a> (${assetLen(k)} khung)`).join('<br>'));
  h += '</table><p class="note">Dựng gần đúng từ template: thân chạy anim của đòn, ở shoot_time sinh đạn/thực thể, đạn tới đích thì sinh hit_fx, decal, mod. Đường đi thật và số mục tiêu do script trong game quyết định.</p>';
  $('info').innerHTML = h; bindLinks();
  for (const b of $('info').querySelectorAll('.atk')) b.onclick = () => { openUnit(name, +b.dataset.i); restart(); renderTimeline(); };
}
function renderTimeline(){
  const tl = $('timeline'); if (!scene) return;
  tl.innerHTML = scene.marks.map(m => `<div class="ev ${m.hit ? 'hit' : ''}" style="left:${100*m.time/scene.dur}%">${m.label}</div>`).join('') + '<div class="head" id="head"></div>';
}
// ------------------------------------------------------------ vòng vẽ
function loop(now){
  const dt = Math.min(0.1, (now - (lastNow || now))/1000); lastNow = now;
  for (const th of thumbs.values()) if (th.vis) drawThumb(th, now);
  if (scene && $('detail').classList.contains('open')){
    const r = stage.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    if (stage.width !== Math.round(r.width*dpr) || stage.height !== Math.round(r.height*dpr)){ stage.width = Math.round(r.width*dpr); stage.height = Math.round(r.height*dpr); }
    if (playing){
      let target = simT + dt*speed;
      if (target > scene.dur){ if (scene.loopAll){ target = target % scene.dur; simT = 0; scene.reset(); scene.step(0); } else { target = 0; scene.reset(); simT = 0; scene.step(0); renderTimeline(); } }
      while (simT + TICK <= target){ simT += TICK; scene.step(simT); }
      simT = target;
    }
    const ctx = stage.getContext('2d'); ctx.setTransform(1,0,0,1,0,0);
    const bg = $('bg').value;
    if (bg === 'check'){ const s = 16*dpr; for (let y = 0; y < stage.height; y += s) for (let x = 0; x < stage.width; x += s){ ctx.fillStyle = ((x + y)/s) % 2 ? '#3a3d42' : '#2c2f33'; ctx.fillRect(x, y, s, s); } }
    else { ctx.fillStyle = bg === 'grass' ? '#6b7a45' : bg === 'light' ? '#e4dccb' : '#1a1c1f'; ctx.fillRect(0, 0, stage.width, stage.height); }
    const z = view.z*dpr, V = [z, 0, 0, z, stage.width/2 - view.cx*z, stage.height/2 - view.cy*z];
    ctx.save(); setT(ctx, V); ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1/z; ctx.beginPath(); ctx.moveTo(-2000, 0); ctx.lineTo(2000, 0); ctx.moveTo(0, -2000); ctx.lineTo(0, 2000); ctx.stroke(); ctx.restore();
    scene.draw(ctx, V, simT, boxes);
    ctx.globalAlpha = 1;
    const fr = Math.floor(simT*FPS + EPS) + 1;
    $('tlabel').textContent = `t = ${simT.toFixed(2)} s · khung ${fr} · ${Math.round(view.z*100)}%`;
    const hd = $('head'); if (hd) hd.style.left = (100*simT/scene.dur) + '%';
  }
  requestAnimationFrame(loop);
}
</script>
