<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bộ Thủy</title>
<style>
:root{--bg:#f4eedc;--ink:#2b2118;--card:#fffaf0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:16px}
h1{font-size:22px;margin:0 0 4px} p{margin:0 0 16px;opacity:.8}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
figure{margin:0;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:8px}
img{width:100%;display:block;border-radius:6px} figcaption{font-weight:600;margin-top:6px}
figcaption span{font-weight:400;opacity:.75}
</style></head><body>
<h1>Bộ hiệu ứng Thủy (bản thử 2026-11-10)</h1>
<p>12 hiệu ứng. Hạt chồng lớp phẳng (hình hạt do GPT vẽ) cộng mảng nước liền tô phẳng cho thân vòi rồng, sóng thần, lưỡi chém. Sinh bằng ArtGen/Spine/bo_thuy.py.</p>
<div class="g">
<figure><img src="tu_nuoc.gif"><figcaption>Tụ nước <span>giọt và sóng xoáy vào, cầu nước lớn dần rồi thấm vào tướng</span></figcaption></figure>
<figure><img src="tia_nuoc.gif"><figcaption>Tia nước <span>tụ ở miệng, bắn dòng nước liền có sóng cuộn; chỗ trúng toé vương miện nước</span></figcaption></figure>
<figure><img src="cau_nuoc.gif"><figcaption>Cầu nước <span>tụ cầu lớn, ném vòng cung, vỡ thành cột nước và mưa giọt</span></figcaption></figure>
<figure><img src="luoi_nuoc.gif"><figcaption>Lưỡi nước <span>hai lưỡi trăng khuyết chém liên tiếp</span></figcaption></figure>
<figure><img src="thuong_nuoc.gif"><figcaption>Thương nước <span>sáu mũi tụ vòng cung trên đầu rồi phóng lần lượt</span></figcaption></figure>
<figure><img src="bong_bong.gif"><figcaption>Bong bóng <span>chùm bong bóng trôi lượn, vỡ lần lượt</span></figcaption></figure>
<figure><img src="song_than.gif"><figcaption>Sóng thần <span>con sóng mào cuộn lăn tới, đổ ập lên đối thủ</span></figcaption></figure>
<figure><img src="mua_rao.gif"><figcaption>Mưa rào <span>mây tụ trên đầu đối thủ rồi trút mưa</span></figcaption></figure>
<figure><img src="xoay_nuoc.gif"><figcaption>Xoáy nước, mạch phun <span>xoáy sát đất siết vào tâm rồi cột nước vọt lên</span></figcaption></figure>
<figure><img src="voi_rong.gif"><figcaption>Vòi rồng nước <span>làm lại: các vòng nước xếp chồng lắc lư, trong mờ</span></figcaption></figure>
<figure><img src="khien_nuoc.gif"><figcaption>Khiên nước <span>bong bóng nước bọc tướng (lặp)</span></figcaption></figure>
<figure><img src="suoi_hoi.gif"><figcaption>Suối hồi phục <span>giọt xanh ngọc xoắn quanh thân, vòng dâng lên, lấp lánh</span></figcaption></figure>
</div></body></html>
