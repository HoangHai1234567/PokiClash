<h1>Sói giáp sắt (tướng 6 đảo Kim) — concept lượt 1</h1>
<div class="luoi">
  <figure><img src="soi_giap_1/mau/goc_ca_con.png"><figcaption><b>Con gốc</b> monster_3263 (khung 0 idle): chỉ để so dáng, chỗ, cỡ từng mảnh</figcaption></figure>
  <figure><img src="soi_giap_1/tai_ve/L1_A.png"><figcaption><b>A</b> sói xám tro, giáp thép xám + vải đỏ thẫm: mũ thép tròn có sống và vành chìa trên mõm, quai da chéo mõm, núm thép + tua đỏ bên tai, đuôi khăn đỏ, giáp vai hai lớp, đai vải đỏ thắt nút, búa đầu trống tròn, khiên tháp đỉnh vòm có núm, mắt hổ phách</figcaption></figure>
  <figure><img src="soi_giap_1/tai_ve/L1_B.png"><figcaption><b>B</b> sói đen than, giáp gang sẫm + đồng thau: mũ chảo vành rộng viền đồng, khoen đồng + dải da bên tai, khăn da sau gáy, giáp vai vòm, giáp ngực ba đinh đồng, thắt lưng da khoá đồng, búa khối có mỏ nhọn, khiên gang tám cạnh bốn đinh, mắt cam, lộ một nanh</figcaption></figure>
  <figure><img src="soi_giap_1/tai_ve/L1_C.png"><figcaption><b>C</b> sói nâu đỏ, giáp bạc + vải xanh lam: mũ chóp nón có thanh che mũi, cánh thép bên tai + ruy băng xanh, khăn xanh, giáp vai ba lá, búa tạ đầu vuông đai sắt, khiên bạc hình giọt có dải ngang, mắt vàng chanh, lộ một nanh</figcaption></figure>
</div>
<figure style="margin-top:14px"><img src="soi_giap_1/mau/_so_goc.png"><figcaption>Viền đỏ = hình bóng con gốc chồng lên A, B, C (độ khớp 0,79 / 0,83 / 0,82). Thân, tay, chân, đuôi, đầu trùng chỗ. Lệch ở mũ (cố ý đổi dáng) và KHIÊN: cả ba vẽ khiên hẹp hơn, đứng lệch sang phải so với phiến khiên gốc (khiên gốc chìa sang trái tới sau mõm). Khiên và búa là mảnh cứng một xương nên chỉnh chỗ được lúc lắp, không ảnh hưởng clip</figcaption></figure>
