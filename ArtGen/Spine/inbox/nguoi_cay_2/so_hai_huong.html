<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Người cây: hai hướng concept</title>
<style>
  body { margin: 0; padding: 16px; background: #5a5d6b; color: #f2f2f2; font: 15px/1.5 "Segoe UI", Arial, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 14px; color: #d8dae2; }
  .luoi { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  figure { margin: 0; background: #fff; border-radius: 10px; overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { background: #2f3140; padding: 10px 14px; }
  figcaption b { font-size: 16px; }
  figcaption span { display: block; color: #c9ccd8; }
</style>
</head>
<body>
<h1>Tướng thứ 7 đảo Mộc: người cây (mã <code>nguoi_cay</code>)</h1>
<p>Hai hướng concept do Claude đề xuất, cùng một dáng (thế thủ của rig gốc). Chọn một hướng hoặc dặn sửa; chưa tách lớp, chưa rig.</p>
<div class="luoi">
  <figure>
    <img src="tai_ve/L1_dam_lay.png" alt="Hướng A">
    <figcaption><b>A · Người rêu đầm lầy</b>
      <span>Mũ trùm rêu, hốc mặt tối chỉ có hai mắt vàng, chồi dương xỉ cuộn, rêu rủ sau gáy, nấm trên vai.</span></figcaption>
  </figure>
  <figure>
    <img src="tai_ve/L1_mat_go.png" alt="Hướng B">
    <figcaption><b>B · Người rễ mặt gỗ</b>
      <span>Mặt nạ gỗ nhạt có gờ mày, mắt hổ phách, khe miệng; ba chiếc lá to làm mũ; hoa kế tím trên vai.</span></figcaption>
  </figure>
</div>
</body>
</html>
