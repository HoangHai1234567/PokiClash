<h1>Hổ lửa (tướng thứ 9 đảo Hỏa, suất hoa_tinh): 3 hướng màu trên cùng bố cục rig</h1>
<p>Đã bỏ sừng, chuông đồng ôm ngực, khuyên + chuông nhỏ dưới bụng. Mây bờm đổi thành mây lửa tô dải màu phẳng. Vòng cổ chân giữ.
Chuyển động thử (da gốc, chỉ để xem nhịp): <a href="hoa_ho_1/rig_goc/xem.html">hoa_ho_1/rig_goc/xem.html</a></p>
<div class="g">
<figure><img src="hoa_ho_1/tai_ve/L1_bach.png"><figcaption><b>A · bach</b>: bạch hổ, vằn than, mây lửa đỏ son + cam + xoáy vàng, vòng vàng đồng (gần con gốc nhất)</figcaption></figure>
<figure><img src="hoa_ho_1/tai_ve/L1_cam.png"><figcaption><b>B · cam</b>: hổ cam vằn nâu đen, ngực + bàn chân kem, mây đỏ thẫm viền vàng, vòng sắt đen</figcaption></figure>
<figure><img src="hoa_ho_1/tai_ve/L1_than.png"><figcaption><b>C · than</b>: hổ xám than vằn cam, mây cam lõi vàng, chổi đuôi là ngọn lửa, vòng đỏ son</figcaption></figure>
