function hex(c) { return [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16) / 255); }

function play(name) {
  cur = name;
  const loop = $("loop").checked || name === IDLE;
  if (name === "__seq") {
    state.setAnimation(0, SEQ[0], false);
    for (const n of SEQ.slice(1)) state.addAnimation(0, n, false, 0);
  } else {
    state.setAnimation(0, name, loop);
    if (!loop && name !== DIE) state.addAnimation(0, IDLE, true, 0);
  }
  for (const b of document.querySelectorAll("#clips button")) b.classList.toggle("on", b.dataset.clip === name);
}

function start() {
  if (am.hasErrors()) { $("st").textContent = "LỖI nạp: " + JSON.stringify(am.getErrors()); return; }
  const atlas = am.require(NAME + ".atlas");
  const sd = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas)).readSkeletonData(SKEL);
  skeleton = new spine.Skeleton(sd);
  const asd = new spine.AnimationStateData(sd);
  asd.defaultMix = 0.18;
  for (const a of sd.animations) asd.setMix(DIE, a.name, 0);
  state = new spine.AnimationState(asd);
  renderer = new spine.SceneRenderer(canvas, ctx);
  state.addListener({event: (entry, ev) => { $("ev").textContent = "sự kiện: " + ev.data.name + (ev.stringValue ? " (" + ev.stringValue + ")" : "") + "  @" + ev.time.toFixed(2) + " s"; }});
  clipSlots = skeleton.slots.filter(s => s.getAttachment() instanceof spine.ClippingAttachment).map(s => [s, s.getAttachment()]);
  if (!clipSlots.length) $("noclipL").style.display = "none";
  const HAS_AURA = !!sd.findAnimation("aura");
  if (!HAS_AURA) $("auraL").style.display = "none";
  const aura = () => { if (HAS_AURA && $("aura").checked) state.setAnimation(1, "aura", true); else state.setEmptyAnimation(1, 0); };
  $("aura").onchange = aura;
  aura();
  const box = $("clips");
  for (const [name, label] of CLIPS.concat([["__seq", "▶ Diễn cả chuỗi"]])) {
    const b = document.createElement("button");
    b.textContent = label; b.dataset.clip = name; b.onclick = () => play(name);
    box.appendChild(b);
  }
  $("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "Chạy" : "Dừng"; $("pause").classList.toggle("on", paused); };
  $("loop").onchange = () => play(cur);
  $("speed").oninput = () => { state.timeScale = +$("speed").value; $("spv").textContent = (+$("speed").value).toFixed(2) + "×"; };
  $("bg").onchange = () => { bg = hex($("bg").value); document.body.style.background = $("bg").value; };
  addEventListener("keydown", e => { const i = "123456789".indexOf(e.key); if (i >= 0 && i < CLIPS.length) play(CLIPS[i][0]); if (e.key === " ") $("pause").click(); });
  play(Q.get("clip") || CLIPS[0][0]);
  $("st").textContent = INFO;
  requestAnimationFrame(frame);
}

let last = 0;
function frame(now) {
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
  last = now;
  if (!paused) state.update(dt);
  const off = $("noclip").checked;
  for (const [s, a] of clipSlots) s.setAttachment(off ? null : a);
  state.apply(skeleton);
  if (off) for (const [s] of clipSlots) s.setAttachment(null);
  skeleton.update(paused ? 0 : dt);
  skeleton.updateWorldTransform(spine.Physics.update);
  renderer.resize(spine.ResizeMode.Expand);
  const cam = renderer.camera;
  const e0 = state.getCurrent(0), want = (e0 && VIEWS[e0.animation.name]) || VIEW;
  for (let i = 0; i < 4; i++) view[i] += (want[i] - view[i]) * Math.min(1, dt * 5);
  cam.position.x = view[0]; cam.position.y = view[1];
  cam.zoom = Math.max(view[2] / canvas.width, view[3] / canvas.height);
  cam.update();
  gl.clearColor(bg[0], bg[1], bg[2], 1); gl.clear(gl.COLOR_BUFFER_BIT);
  renderer.begin();
  renderer.drawSkeleton(skeleton, false);
  if ($("bones").checked) renderer.drawSkeletonDebug(skeleton, false);
  renderer.end();
  const e = state.getCurrent(0);
  if (e) $("tt").textContent = `${e.animation.name}  ${(e.loop ? e.trackTime % e.animation.duration : Math.min(e.trackTime, e.animation.duration)).toFixed(2)} / ${e.animation.duration.toFixed(2)} s`;
  requestAnimationFrame(frame);
}

(function wait() { if (am.isLoadingComplete()) { try { start(); } catch (err) { $("st").textContent = "LỖI: " + err + "\n" + (err.stack || ""); } } else requestAnimationFrame(wait); })();
</script>
</body>
