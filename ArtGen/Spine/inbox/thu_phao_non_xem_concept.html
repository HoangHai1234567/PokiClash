<h1>Thú giáp pháo (tướng 9 đảo Kim) — DẠNG 1 non, concept lượt 1</h1>
<div class="luoi">
  <figure><img src="thu_phao_non/mau/bo_cuc_khung.png"><figcaption><b>Bố cục</b>: rig dạng 2 đổi tỉ lệ (đầu × 1,45, tai ngắn, pháo × 0,78, đuôi × 0,85), da tạm dạng 2: concept phải trùng dáng, cỡ từng bộ phận</figcaption></figure>
  <figure><img src="thu_phao_1/tai_ve/L1_duyet.png"><figcaption><b>Dạng 2</b> đã duyệt (concept C)</figcaption></figure>
  <figure><img src="thu_phao_non/tai_ve/L1_A.png"><figcaption><b>A (đề xuất)</b> thú con giáp bạc nhẹ, mũ tròn hở mặt lộ mặt thú con (da xanh xám, mắt tròn to vàng, mõm nhỏ), tai thú ngắn viền vàng, pháo cùng dáng viền vàng mảnh</figcaption></figure>
  <figure><img src="thu_phao_non/tai_ve/L1_B.png"><figcaption><b>B</b> đồng thau học việc: giáp đồng thau + khớp thép, mũ tròn kín một khe mắt, hai núm sừng đồng, pháo đồng đai thép, vây đồng</figcaption></figure>
  <figure><img src="thu_phao_non/tai_ve/L1_C.png"><figcaption><b>C</b> giáp gỗ đai sắt sơ khai: tấm gỗ sáng + đai sắt, mũ thùng gỗ hai lỗ mắt, chốt gỗ thay tai, pháo gỗ đóng đai, khung họng sắt</figcaption></figure>
</div>
