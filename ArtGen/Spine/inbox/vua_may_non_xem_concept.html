<h1>Vua robot (tướng 10 / boss đảo Kim) — DẠNG 1 non, concept lượt 1</h1>
<div class="luoi">
  <figure><img src="vua_may_non/mau/bo_cuc_khung.png"><figcaption><b>Bố cục</b>: rig dạng 2 đổi tỉ lệ (đầu × 1,4, bốn cánh × 0,55, hào quang × 0,55, ba hành tinh × 0,75; thân, tay, chân, quyền trượng giữ), da tạm dạng 2: concept phải trùng dáng, cỡ từng bộ phận</figcaption></figure>
  <figure><img src="vua_may_1/tai_ve/L1_duyet.png"><figcaption><b>Dạng 2</b> đã duyệt (concept B lượt 3)</figcaption></figure>
  <figure><img src="vua_may_non/tai_ve/L1_A.png"><figcaption><b>A (đề xuất)</b> hoàng tử robot cùng màu dạng 2: mặt trẻ không râu, mắt vàng tròn to, vương miện thấp ba chóp ngọc đỏ, giáp ít tấm, bốn cánh lông non trắng ngọn vàng, hào quang vòng vàng mảnh năm hạt ngọc</figcaption></figure>
  <figure><img src="vua_may_non/tai_ve/L1_B.png"><figcaption><b>B</b> tiểu vương đồng thau: giáp đồng thau + thép xám, mắt lam, ria bạc nhỏ, vương miện đồng bốn núm, cánh máy non lông xám ngọn đồng, hào quang bánh răng đồng</figcaption></figure>
  <figure><img src="vua_may_non/tai_ve/L1_C.png"><figcaption><b>C</b> hoàng tử bạc men lam: giáp bạc + men lam viền vàng mảnh, áo choàng lam đậm, vòng bạc một ngọc lam, cánh trắng ngọn lam nhạt, hào quang vòng năm ngôi sao</figcaption></figure>
