<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Quặng sắt dạng 2</title>
<style>
  body { margin: 0; padding: 16px; background: #2a2b31; color: #eee; font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .luoi { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  figure { margin: 0; background: #fff; border-radius: 8px; overflow: hidden; }
  figure img { width: 100%; display: block; }
  figcaption { background: #1d1e22; padding: 8px 10px; color: #ddd; }
  b { color: #ffcf6a; }
</style>
</head>
<body>
<h1>Tinh linh quặng sắt — concept dạng 2 (dạng cuối), cùng rig với dạng 1</h1>
<div class="luoi">
  <figure><img src="quang_sat_1/tai_ve/L1_duyet.png"><figcaption><b>Dạng 1</b> đã duyệt (để so)</figcaption></figure>
  <figure><img src="quang_sat_2/tai_ve/L1_A.png"><figcaption><b>A</b> giáp sắt rèn sẫm, mày giáp thép + hai sừng thép ngắn, vương miện năm gai từ thạch, tay là hai tinh thể ghép như găng</figcaption></figure>
  <figure><img src="quang_sat_2/tai_ve/L1_B.png"><figcaption><b>B</b> đá bazan có mạch quặng cam, mày đá, chùm năm gai hematit đỏ gỉ, tay là tinh thể hematit to</figcaption></figure>
  <figure><img src="quang_sat_2/tai_ve/L1_C.png"><figcaption><b>C</b> thép xám lam, mày giáp, hai sừng cong thành nam châm móng ngựa (đầu đỏ / bạc), tay là hai khối cực nam châm</figcaption></figure>
</div>
</body>
</html>
