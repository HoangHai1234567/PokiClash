<h1>Vua robot (final boss đảo Kim) — lượt 3: bớt chi tiết thân, quyền trượng hệ mặt trời (Mặt Trời gắn trượng; Trái Đất, Sao Hỏa, Sao Thủy lơ lửng)</h1>
<div class="luoi">
  <figure><img src="vua_may_1/tai_ve/L3_A.png" alt="A3 đang gen"><figcaption><b>A3</b> vàng + men trắng, cánh máy xanh trắng, vòng mặt trời (chưa thấy ảnh: đang gen, tải lại trang sau vài phút)</figcaption></figure>
  <figure><img src="vua_may_1/tai_ve/L3_B.png" alt="B3 đang gen"><figcaption><b>B3</b> vàng + bạc, cánh lông trắng, vòng nguyệt quế</figcaption></figure>
  <figure><img src="vua_may_1/tai_ve/L3_C.png" alt="C3 đang gen"><figcaption><b>C3</b> thép đen + vàng, cánh lông đen tím, vòng răng nhọn</figcaption></figure>
</div>
<h1 style="margin-top:22px">Lượt 2: cánh hoàng gia nhiều tầng + vòng hoa văn sau lưng (thân giữ nguyên lượt 1)</h1>
<div class="luoi">
  <figure><img src="vua_may_1/tai_ve/L2_A.png"><figcaption><b>A2</b> cánh máy ba tầng: lông phủ men xanh hoàng gia, tầng giữa + lông dài thép trắng viền vàng ngọn vàng; tay cánh vàng chạm hoa văn, hoa ngọc lam ở cổ cánh; vòng mặt trời vàng nhạt răng bánh răng, vành ngọc lam</figcaption></figure>
  <figure><img src="vua_may_1/tai_ve/L2_B.png"><figcaption><b>B2</b> cánh lông vũ trắng ba tầng ngọn vàng; tay cánh bạc chạm vàng, ngọc trai; vòng hào quang nguyệt quế, tia sáng thẳng, vành ngọc trai</figcaption></figure>
  <figure><img src="vua_may_1/tai_ve/L2_C.png" alt="C2 đang gen, tải lại trang sau ~2 phút"><figcaption><b>C2</b> cánh lông đen ba tầng (lông phủ tím mận viền vàng, ngọn vàng); tay cánh đen vàng ngọc đỏ; vòng răng nhọn vàng nhạt + tím, ngọc đỏ (nếu chưa thấy ảnh: đang gen, tải lại trang sau ~2 phút)</figcaption></figure>
</div>
<h1 style="margin-top:22px">Lượt 1</h1>
<div class="luoi">
  <figure><img src="vua_may_1/tai_ve/L1_A.png"><figcaption><b>A</b> (Claude đề xuất) vàng hoàng kim + men trắng ngà, <b>4 cánh MÁY</b>: tay cánh vàng tán đinh, lông thép trắng viền vàng, lõi ngọc lam; vương miện tia mặt trời đính ngọc lam, mắt lam xếch, râu kim loại trắng xoăn, mũi hồng ngọc; áo choàng đỏ thẫm thêu bánh răng; đầu trượng bánh răng mặt trời; chân giáp vàng – trắng, gối bánh răng, pít-tông, bàn chân ba ngón</figcaption></figure>
  <figure><img src="vua_may_1/tai_ve/L1_B.png"><figcaption><b>B</b> vàng + bạc, <b>4 cánh LÔNG VŨ TRẮNG</b> thiên thần (ngọn vàng nhạt, gốc vòng vàng); vương miện nguyệt quế, mắt vàng, râu bạc dài chẻ đôi; áo choàng đỏ son viền lông trắng; đầu trượng bánh răng có hai cánh nhỏ, ngọc trai</figcaption></figure>
  <figure><img src="vua_may_1/tai_ve/L1_C.png"><figcaption><b>C</b> (bản tối) thép đen + vàng, <b>4 cánh LÔNG VŨ ĐEN</b> ánh tím than, ngọn vàng, ngọc đỏ ở gốc; vương miện răng nhọn ngọc đỏ, mắt đỏ, râu vàng vuông nhiều tầng; áo choàng đỏ rượu, dải tím; đầu trượng bánh răng ngọc đỏ</figcaption></figure>
  <figure><img src="vua_may_1/mau/bo_cuc.png"><figcaption><b>Sơ đồ bố cục</b> (ảnh mẫu 1 gửi GPT): thân con gốc nâng lên, chân khối giữ chỗ, 4 cánh xám giữ chỗ — đúng chỗ sẽ lắp xương</figcaption></figure>
  <figure><img src="vua_may_1/mau/_so_bo_cuc.png"><figcaption><b>So với sơ đồ</b> (viền đỏ): GPT vẽ to hơn ~14 % và thẳng mặt hơn; co về cùng cỡ thì phần thân + chân khớp 0,80 (A), 0,80 (B), 0,82 (C)</figcaption></figure>
  <figure><img src="vua_may_1/mau/goc_ca_con.png"><figcaption><b>Con gốc</b> monster_3637 (khung 0 idle): chỉ để so, không đăng công khai</figcaption></figure>
</div>
