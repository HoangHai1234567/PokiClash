  figure { margin: 0; background: #fff; border-radius: 8px; overflow: hidden; }

<body>
<h1>Kỵ sĩ cổ đại bị nguyền (tướng 8 đảo Kim) — concept lượt 1</h1>
<div class="luoi">
  <figure><img src="ky_nguyen_1/mau/goc_ca_con.png"><figcaption><b>Con gốc</b> monster_3642 (khung 0 idle): chỉ để so dáng, chỗ, cỡ từng mảnh</figcaption></figure>
  <figure><img src="ky_nguyen_1/tai_ve/L1_A.png"><figcaption><b>A</b> lửa linh hồn trong giáp: khoảng rỗng là lửa xanh, mũ thùng khe chữ thập, chùm lửa xanh thay lông vũ, gai sắt rỉ, giáp vai răng cưa, ngực nứt lộ lửa, áo choàng đen than mép lửa</figcaption></figure>
  <figure><img src="ky_nguyen_1/tai_ve/L1_B.png"><figcaption><b>B</b> hồn ma bóng tối: khoảng rỗng đen xanh thẫm có lửa liếm mép, lưỡi lửa xanh phụt ra khe giáp, mũ hai sừng, bờm lửa ma, viền đồng xỉn, áo choàng xanh rêu</figcaption></figure>
  <figure><img src="ky_nguyen_1/tai_ve/L1_C.png"><figcaption><b>C</b> vua chiến trận cổ: rỉ nặng, viền vàng sờn, mũ vương miện gai, lửa bốc từ vương miện, mũi tên + giáo gãy cắm trên giáp, áo choàng đỏ rượu phai</figcaption></figure>
</div>
<figure style="margin-top:14px"><img src="ky_nguyen_1/mau/_so_goc.png"><figcaption>Viền đỏ = hình bóng con gốc chồng lên A, B, C</figcaption></figure>
