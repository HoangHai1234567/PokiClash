<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Robot cổ concept</title>
<style>
  body { margin: 0; padding: 16px; background: #2a2b31; color: #eee; font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .luoi { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  figure { margin: 0; background: #fff; border-radius: 8px; overflow: hidden; }
  figure img { width: 100%; display: block; }
  figcaption { background: #1d1e22; padding: 8px 10px; color: #ddd; }
  b { color: #ffcf6a; }
</style>
</head>
<body>
<h1>Robot hủy diệt cổ đại (tướng 7 đảo Kim) — concept lượt 1</h1>
<div class="luoi">
  <figure><img src="robot_co_1/mau/goc_ca_con.png"><figcaption><b>Con gốc</b> monster_3613 (khung 0 idle): chỉ để so dáng, chỗ, cỡ từng mảnh</figcaption></figure>
  <figure><img src="robot_co_1/tai_ve/L1_A.png"><figcaption><b>A</b> đồng thau cổ phủ gỉ xanh: chỏm miệng vạc hai quai vuông, mặt nạ khối vuông (GPT không vẽ đáy nhọn), gai vai lưỡi rìu đồng, giáp ngực hoa văn xoắn vuông, vải xanh mòng két, đinh đồng tròn, mắt đỏ cam</figcaption></figure>
  <figure><img src="robot_co_1/tai_ve/L1_B.png"><figcaption><b>B</b> thép đen + vàng kim + xanh lam kiểu Ai Cập: mũ trùm pharaoh sọc vàng – lam (đầu to hơn con gốc), mặt nạ vàng chòm cằm dài, gai vai cánh chim ưng, giáp ngực vòng cổ sọc, vải lam viền vàng, mắt đỏ</figcaption></figure>
  <figure><img src="robot_co_1/tai_ve/L1_C.png"><figcaption><b>C</b> sắt cổ gỉ sét, cỗ máy chiến tranh: mũ vòm một vây sống, mặt nạ vuông hàm lưới, mỗi vai hai ống xả, giáp tán đinh to, dải da nâu, mắt vàng hổ phách</figcaption></figure>
</div>
<figure style="margin-top:14px"><img src="robot_co_1/mau/_so_goc_co.png"><figcaption>Viền đỏ = hình bóng con gốc, concept co về cùng cỡ (GPT vẽ to hơn ~13 %): độ khớp A 0,82 / B 0,86 / C 0,84. Lệch chủ yếu ở chỏm đầu và gai vai (cố ý đổi dáng; đều là mảnh cứng một xương nên không ảnh hưởng clip)</figcaption></figure>
</body>
