<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thú giáp pháo non đầu</title>
<style>
  body { margin: 0; padding: 16px; background: #2a2b31; color: #eee; font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .luoi { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  figure { margin: 0; background: #fff; border-radius: 8px; overflow: hidden; }
  figure img { width: 100%; display: block; }
  figcaption { background: #1d1e22; padding: 8px 10px; color: #ddd; }
  b { color: #ffcf6a; }
</style>
</head>
<body>
<h1>Thú giáp pháo dạng 1 — lượt 1b: sửa đầu bản A cho cùng dòng dạng 2</h1>
<div class="luoi">
  <figure><img src="thu_phao_1/tai_ve/L1_duyet.png"><figcaption><b>Dạng 2</b> đã duyệt: mũ hiệp sĩ khe chữ T, chỏm vàng, tai giáp nhọn cao</figcaption></figure>
  <figure><img src="thu_phao_non/tai_ve/L1_A.png"><figcaption><b>Bản A</b> (thân giữ nguyên, đầu cần sửa)</figcaption></figure>
  <figure><img src="thu_phao_non/tai_ve/L2_1.png"><figcaption><b>Kiểu 1</b> mũ hiệp sĩ non khép: tròn hơn, khe chữ T rộng lộ hai mắt tròn to, chỏm vàng ngắn, tai giáp nhọn ngắn</figcaption></figure>
  <figure><img src="thu_phao_non/tai_ve/L2_1_2.png"><figcaption><b>Kiểu 1b (đề xuất)</b> cùng lời dặn kiểu 1, lượt gen thứ hai: gần mũ dạng 2 nhất (khe chữ T, mắt xếch quả quyết), tròn và non hơn</figcaption></figure>
  <figure><img src="thu_phao_non/mau/_dau_can.png"><figcaption><b>Cận đầu</b>: dạng 2, 1, 1b / 2, 3, bản A</figcaption></figure>
  <figure><img src="thu_phao_non/tai_ve/L2_2.png"><figcaption><b>Kiểu 2</b> mũ hiệp sĩ dạng 2 mở tấm che: tấm che đẩy lên trán, lộ mặt thú con bên dưới</figcaption></figure>
  <figure><img src="thu_phao_non/tai_ve/L2_3.png"><figcaption><b>Kiểu 3</b> mũ hiệp sĩ khoét chữ T rộng: mắt thú ở thanh ngang, mõm ở thanh dọc nhìn qua</figcaption></figure>
</div>
</body>
</html>
