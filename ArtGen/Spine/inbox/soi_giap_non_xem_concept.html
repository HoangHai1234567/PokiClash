<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sói con concept</title>
<style>
  body { margin: 0; padding: 16px; background: #2a2b31; color: #eee; font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .luoi { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  figure { margin: 0; background: #fff; border-radius: 8px; overflow: hidden; }
  figure img { width: 100%; display: block; }
  figcaption { background: #1d1e22; padding: 8px 10px; color: #ddd; }
  b { color: #ffcf6a; }
</style>
</head>
<body>
<h1>Sói giáp sắt dạng 1 (sói con chibi) — concept lượt 1</h1>
<div class="luoi">
  <figure><img src="soi_giap_non/mau/bo_cuc_khung.png"><figcaption><b>Bố cục rig</b> ở tỉ lệ dạng non (dựng bằng da dạng 2): chỉ để so dáng, chỗ, cỡ</figcaption></figure>
  <figure><img src="soi_giap_1/tai_ve/L1_duyet.png"><figcaption><b>Dạng 2 đã duyệt</b> (để so: dạng 1 nhạt hơn, ít giáp hơn)</figcaption></figure>
  <figure><img src="soi_giap_non/tai_ve/L1_A.png"><figcaption><b>A</b> xám tro, đồ da + sắt thô: mũ sắt tròn quai da, giáp vai da khâu, áo gi lê da khoá sắt, đai thừng, quấn da cẳng tay, khiên gỗ tám cạnh viền sắt bốn đinh, búa khối nhỏ cán gỗ, mắt hổ phách</figcaption></figure>
  <figure><img src="soi_giap_non/tai_ve/L1_B.png"><figcaption><b>B</b> xám xanh, mũ da: mũ da đai sắt, giáp vai một tấm sắt, ngực lông xù với dây đai chéo, bao tay da, khiên tròn gỗ núm sắt, búa là cái vồ gỗ hai đai sắt, mắt cam</figcaption></figure>
  <figure><img src="soi_giap_non/tai_ve/L1_C.png"><figcaption><b>C</b> xám bạc + lưng than (dạng 2 thu nhỏ): mũ đỉnh bằng hai mầm vây vành đồng, giáp vai vòm một gai cụt viền đồng, áo da có tấm thép + đinh đồng, khiên gỗ tám cạnh đinh đồng, búa khối nhỏ, mắt cam</figcaption></figure>
</div>
<figure style="margin-top:14px"><img src="soi_giap_non/mau/_so_bo_cuc.png"><figcaption>Viền đỏ = hình bóng bố cục rig chồng lên A, B, C (khớp 0,72 / 0,65 / 0,74). Cả ba bỏ cái bướu bờm (đúng dặn) và vẽ thân gọn hơn bố cục; A, C nhỏ hơn bố cục một chút, B to hơn. Lúc lắp rig, thân và tay chân là mảnh của rig nên sẽ hơi đậm người hơn concept; nếu bạn muốn sát concept hơn tôi thu thêm thân trên rig</figcaption></figure>
</body>
</html>
