<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Người cây: dạng 1 và dạng 2</title>
<style>
  body { margin: 0; padding: 16px; background: #5a5d6b; color: #f2f2f2; font: 15px/1.5 "Segoe UI", Arial, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 14px; color: #d8dae2; }
  .luoi { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  figure { margin: 0; background: #fff; border-radius: 10px; overflow: hidden; }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { background: #2f3140; padding: 10px 14px; }
  figcaption b { font-size: 16px; }
  figcaption span { display: block; color: #c9ccd8; }
</style>
</head>
<body>
<h1>Tướng thứ 7 đảo Mộc: người cây, hai dạng</h1>
<p>Dạng 1 là concept mới, chờ duyệt (chưa tách mảnh, chưa rig). Dạng 2 là bản D đã duyệt và đã rig.</p>
<div class="luoi">
  <figure>
    <img src="tai_ve/L1.png" alt="Dạng 1">
    <figcaption><b>Dạng 1 · con non (chờ duyệt)</b>
      <span>Đầu to tròn như cái nụ, mầm hai lá trên đầu, hai túm rêu nhỏ trên vai, tay gỗ quấn dây leo trơn không gai, váy lá ngắn, màu lục non.</span></figcaption>
  </figure>
  <figure>
    <img src="../nguoi_cay_2/tai_ve/L1_duyet.png" alt="Dạng 2">
    <figcaption><b>Dạng 2 · dạng lớn (đã duyệt, đã rig)</b>
      <span>Hai u rêu vai to có cành khô, đầu nhỏ nhe nanh có râu lá, tay gỗ quấn dây gai, váy lá răng cưa.</span></figcaption>
  </figure>
</div>
</body>
</html>
