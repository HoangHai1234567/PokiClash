<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Robot cổ non concept</title>
<style>
  body { margin: 0; padding: 16px; background: #2a2b31; color: #eee; font: 15px/1.45 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .luoi { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  figure { margin: 0; background: #fff; border-radius: 8px; overflow: hidden; }
  figure img { width: 100%; display: block; }
  figcaption { background: #1d1e22; padding: 8px 10px; color: #ddd; }
  b { color: #ffcf6a; }
</style>
</head>
<body>
<h1>Robot hủy diệt cổ đại — DẠNG 1 NON, concept lượt 1</h1>
<div class="luoi">
  <figure><img src="robot_co_1/tai_ve/L1_duyet.png"><figcaption><b>Dạng 2</b> đã duyệt (robot sắt cổ gỉ sét): để so</figcaption></figure>
  <figure><img src="robot_co_non/mau/bo_cuc_khung.png"><figcaption><b>Bố cục</b> dạng non dựng từ rig (giáp vai, cẳng tay, ống xả nhỏ lại; da tạm dạng 2)</figcaption></figure>
  <figure><img src="robot_co_non/tai_ve/L1_A.png"><figcaption><b>A</b> robot con thép mới: thép sáng không gỉ, đầu vòm to tròn, vây thành mẩu nhỏ, mỗi vai một ống xả, giáp vai tròn hai đinh, vải bố vàng nhạt ở eo (GPT vẽ liền một tấm)</figcaption></figure>
  <figure><img src="robot_co_non/tai_ve/L1_B.png"><figcaption><b>B</b> robot đồng thau học việc: đồng thau vàng ấm + khớp sắt sẫm, ăng-ten có quả cầu thay vây, mỗi vai một ống còi đồng, dải da nâu sáng</figcaption></figure>
  <figure><img src="robot_co_non/tai_ve/L1_C.png"><figcaption><b>C</b> robot gỗ đai sắt sơ khai: tấm gỗ sáng ghép + đai sắt đinh tán, chốt gỗ thay vây, ống phễu sắt, dây thừng thắt nút ở eo</figcaption></figure>
</div>
<figure style="margin-top:14px"><img src="robot_co_non/mau/_so_bo_cuc.png"><figcaption>Viền đỏ = hình bóng bố cục rig chồng lên A, B, C (độ khớp 0,80 / 0,85 / 0,85; lệch chủ yếu ở đầu, cố ý vẽ to hơn)</figcaption></figure>
