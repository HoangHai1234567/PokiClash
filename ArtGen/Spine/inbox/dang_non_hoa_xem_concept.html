<h1>Concept dạng 1 (chibi): suất 5 Hỏa Quy và suất 7 Viêm Đao, đảo Hỏa</h1>
<p>Gen 2026-11-14 ở máy ổ D. Mỗi con hai hướng (đề xuất của Claude). Bạn chọn hướng hoặc dặn sửa, rồi mình làm mảnh, rig, clip tiến hóa và đưa vào game.</p>

<h2>Suất 5: Hỏa Quy Con (chọn một)</h2>
<div class="row">
<figure><img src="rua_lua_non/tai_ve/L1_theo_e.png"><figcaption><b class="k">A</b><b>Theo bản E</b>: giữ chỗ đặt của bản E đang ở trong game, vẽ lại nét chibi (đầu khoảng 45 %).</figcaption></figure>
<figure><img src="rua_lua_non/tai_ve/L1_tron_hon.png"><figcaption><b class="k">B</b><b>Tròn hơn</b>: mai tròn ngắn như hòn cuội, chân lùn hẳn, đầu gần nửa chiều cao.</figcaption></figure>
</div>
<div class="row" style="margin-top:12px">

<div class="row">

<figure><img src="quy_dao_non/tai_ve/L1_tron_hon.png"><figcaption><b class="k">B</b><b>Tròn hơn</b>: đầu gần nửa chiều cao, thân tròn lùn, tay chân ngắn hẳn, đao ngắn bè như dao phay.</figcaption></figure>
