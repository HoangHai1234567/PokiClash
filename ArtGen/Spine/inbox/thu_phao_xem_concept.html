<h1>Thú giáp pháo (tướng 9 đảo Kim) — concept lượt 1</h1>
<div class="luoi">
  <figure><img src="thu_phao_1/mau/goc_ca_con.png"><figcaption><b>Con gốc</b> monster_3629 (khung 0 idle): chỉ để so dáng, chỗ, cỡ từng mảnh</figcaption></figure>
  <figure><img src="thu_phao_1/tai_ve/L1_A.png"><figcaption><b>A (đề xuất)</b> thép xám lam + đồng thau, lõi điện lam: mũ giáp heo rừng mắt lam xếch, hai sừng lưỡi thép, nòng tròn hai đai đồng, họng loe vành đồng lòng lam, lõi ô cửa đồng, tay cầm chữ C, bốn đốt đuôi viền đồng. Khớp hình bóng 0,93</figcaption></figure>
  <figure><img src="thu_phao_1/tai_ve/L1_B.png"><figcaption><b>B</b> sắt đen rèn + đồng đỏ, lõi lửa lò cam: mũ tê giác một sừng mũi, nòng ba đai đồng đỏ đinh to, họng răng cưa, cửa lò có song, ống khói, vây tản nhiệt, đốt đuôi gai tù. Khớp hình bóng 0,92</figcaption></figure>
  <figure><img src="thu_phao_1/tai_ve/L1_C.png"><figcaption><b>C</b> thép bạc trắng + vàng kim, lõi vàng: mũ hiệp sĩ khe chữ T, tai giáp dựng, thân pháo dáng hộp, họng tròn có cánh vàng, lõi mặt trời, cánh vàng thay móc, vảy đuôi viền vàng. Khớp hình bóng 0,93</figcaption></figure>
  <figure><img src="thu_phao_1/mau/_so_goc.png"><figcaption><b>So con gốc</b>: viền đỏ là hình bóng con gốc chồng lên A, B, C</figcaption></figure>
</div>
