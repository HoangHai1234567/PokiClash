<div class="luoi">

  <figure><img src="soi_giap_1/tai_ve/L1_A.png" onerror="this.outerHTML='<div class=cho>A: chưa gen</div>'"><figcaption><b>A</b> sói xám tro, giáp thép xám + đỏ thẫm: mũ thép tròn một sống, mặt nạ mõm nhọn, cổ áo thép hai lớp, giáp vai ba lá + gai nón thẳng, giáp ngực, đai vải đỏ, búa đầu trống tròn, khiên tháp đỉnh vòm</figcaption></figure>
  <figure><img src="soi_giap_1/tai_ve/L1_B.png" onerror="this.outerHTML='<div class=cho>B: chưa gen</div>'"><figcaption><b>B</b> sói đen than, giáp gang + đồng thau: mũ đỉnh bằng, mặt nạ khe ngang viền đồng, hai vây sắt vuốt sau, giáp vai vòm + ba gai ngắn, giáp ngực ba đinh đồng, thắt lưng da khoá đồng, búa có mỏ, khiên vát góc</figcaption></figure>
  <figure><img src="soi_giap_1/tai_ve/L1_C.png" onerror="this.outerHTML='<div class=cho>C: chưa gen</div>'"><figcaption><b>C</b> sói nâu đỏ, giáp bạc + xanh lam: mũ chóp nhọn, mặt nạ mõm sói có thanh che mũi, tấm gáy ba lá xoè, giáp vai ba lá + vây lưỡi cong, giáp ngực hai lớp, búa tạ đầu vuông, khiên hình diều</figcaption></figure>
</div>
<figure style="margin-top:14px"><img src="soi_giap_1/mau/_so_goc_co.png"><figcaption>Viền đỏ = hình bóng con gốc, co cho bằng cỡ từng concept (GPT vẽ to hơn gốc: A ×1,22, B ×1,38, C ×1,10). Độ khớp dáng A 0,87 / B 0,86 / C 0,89: thân, tay, chân, đầu, búa trùng chỗ. Lệch: cả ba vẽ KHIÊN hẹp hơn khiên gốc (gốc loe rộng sang phải); tai gần dựng đứng trên mũ thay vì chĩa ngang như gốc (lúc làm mảnh sẽ vẽ theo khung tai gốc). B: mỏ búa cong vểnh lên trông như cái sừng. C: vây lưỡi cong trên vai gần như cùng hình bóng sừng gốc (chỉ đổi chất bạc)</figcaption></figure>
